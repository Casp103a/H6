map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name nimbus-watch.com;

    root /var/www/html;
    index index.php index.html index.htm;

    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass http://nimbuswatchapi:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
    }
	
	# SignalR hubs (negotiate + WebSockets/SSE/long polling)
	location /hubs/ {
		proxy_pass http://nimbuswatchapi:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host $host;

		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
		proxy_buffering off;
		proxy_cache off;
	}

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Company-scoped URLs: /{companyName}/index.php and /{companyName}/users.php
    # are served from the real file at the site root — there's no per-company
    # folder on disk, the company name is just a visible path segment.
    # (nginx never reads .htaccess, so this replaces that Apache-only rule.)
    location ~ ^/[^/]+/([A-Za-z0-9_-]+\.php)$ {
        try_files /$1 =404;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/$1;
        fastcgi_param SCRIPT_NAME /$1;
        fastcgi_param HTTPS on;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }
}
