services:
  mariadb:
    image: mariadb:12.3
    container_name: mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MariaDBROOTPassword}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - mariadb_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  nimbuswatchapi:
    build:
      context: .
      dockerfile: NimbusWatchApi/Dockerfile
    container_name: nimbus-watch-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: ${ConnectionString}
      JWT__Issuer: https://nimbus-watch.com
      JWT__Audience: https://nimbus-watch.com
      JWT__SigningKey: ${JWT__SigningKey}
    expose:
      - "8080"
    depends_on:
      - mariadb

  app:
    build:
      context: ./NimbusWatchWebsite
    container_name: nimbus-watch-web
    restart: unless-stopped
    volumes:
      - ./NimbusWatchWebsite:/var/www/html:ro
    expose:
      - "9000"

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./NimbusWatchWebsite:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - nimbuswatchapi

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - nginx

volumes:
  mariadb_data: